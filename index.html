<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="План Танцуй">
<title>Контент-план «Танцуй»</title>
<style>
:root{
  --paper:#FBFAFD; --panel:#FFFFFF; --ink:#2A1533; --muted:#6F6078; --line:#E4DDEA;
  --fuchsia:#D4157E; --teal:#00857F; --sun:#F2B400; --plum:#5B2A86; --danger:#B3261E;
  --seg-off:#E9E3EE; --tag-ink:#FFFFFF; --sun-ink:#2A1533;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A0F21; --panel:#251730; --ink:#F4EEF7; --muted:#B3A4BD; --line:#3B2A47;
    --fuchsia:#FF5FB2; --teal:#3FD1C8; --sun:#FFCF4A; --plum:#B68AE6; --danger:#FF8A80;
    --seg-off:#3B2A47; --tag-ink:#1A0F21; --sun-ink:#1A0F21;
  }
}
:root[data-theme="dark"]{
  --paper:#1A0F21; --panel:#251730; --ink:#F4EEF7; --muted:#B3A4BD; --line:#3B2A47;
  --fuchsia:#FF5FB2; --teal:#3FD1C8; --sun:#FFCF4A; --plum:#B68AE6; --danger:#FF8A80;
  --seg-off:#3B2A47; --tag-ink:#1A0F21; --sun-ink:#1A0F21;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:1rem;line-height:1.5}
.wrap{max-width:60rem;margin:0 auto;padding:2rem 1.25rem 4rem}
h1{font-weight:800;font-size:clamp(1.7rem,5.2vw,3.1rem);line-height:1.08;margin:0 0 .75rem;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:42rem;margin:0 0 1.75rem}
.progress{margin:0 0 1.5rem}
.progress-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.2rem 1rem;margin-bottom:.5rem}
.progress-top strong{font-weight:700;font-size:1.05rem}
.progress-top span{color:var(--muted);font-size:.9rem}
.gaiter{display:flex;gap:3px;height:2rem;border-radius:.4rem 1rem 1rem .4rem;overflow:hidden;background:var(--seg-off)}
.gaiter i{flex:1;background:var(--seg-off);transition:background .25s}
.gaiter i.on:nth-child(3n+1){background:var(--fuchsia)}
.gaiter i.on:nth-child(3n+2){background:var(--sun)}
.gaiter i.on:nth-child(3n){background:var(--teal)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 .75rem}
.btn{font:inherit;font-weight:500;color:var(--ink);background:transparent;
  border:1.5px solid var(--line);border-radius:2rem;padding:.4rem .95rem;cursor:pointer}
.btn[aria-pressed="true"],.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{font-size:.875rem;padding:.3rem .85rem;border-color:var(--ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.note{color:var(--muted);font-size:.875rem;margin:0 0 1.5rem;min-height:1.3em}
.xfer{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:1rem;margin:0 0 1.5rem}
.xfer p{margin:0 0 .6rem;font-size:.9rem;color:var(--muted)}
.day{display:grid;grid-template-columns:11rem 1fr;gap:1.5rem;padding:1.75rem 0;border-top:2px solid var(--ink)}
.day-date{font-weight:800;font-size:2.4rem;line-height:1}
.day-dow{font-weight:600;font-size:.95rem;margin-top:.3rem}
.day-aud{margin-top:.9rem;font-weight:600}
.day-el{color:var(--muted);font-size:.95rem}
.day-count{margin-top:.7rem;font-size:.875rem;color:var(--muted)}
.empty{color:var(--muted);margin:0 0 .6rem}
.item{display:grid;grid-template-columns:2.25rem 1fr;align-items:start;
  background:var(--panel);border:1px solid var(--line);border-radius:.75rem;margin-bottom:.6rem}
.item.done{opacity:.62}
.item.done .title{text-decoration:line-through}
.item.editing{display:block;padding:.9rem 1rem 1rem}
.check{display:flex;justify-content:center;padding:.95rem 0 0 .6rem;cursor:pointer}
.check input{width:1.25rem;height:1.25rem;accent-color:var(--fuchsia);cursor:pointer;margin:0}
details{min-width:0}
summary{list-style:none;cursor:pointer;padding:.8rem 1rem .8rem .6rem;display:flex;flex-wrap:wrap;
  align-items:center;gap:.4rem .6rem;border-radius:.75rem}
summary::-webkit-details-marker{display:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:2.9rem}
.tag{font-size:.78rem;font-weight:600;padding:.12rem .55rem;border-radius:.35rem;color:var(--tag-ink)}
.tag.story{background:var(--teal)} .tag.post{background:var(--plum)} .tag.reel{background:var(--fuchsia)}
.tag.mark{background:var(--sun);color:var(--sun-ink)}
.title{font-weight:600;flex:1 1 14rem}
.body{padding:0 1rem 1rem .6rem;max-width:40rem}
.body dl{margin:0}
.body dt{font-size:.85rem;color:var(--muted);margin-top:.7rem}
.body dd{margin:.1rem 0 0;white-space:pre-wrap}
.text{background:var(--paper);border:1px dashed var(--line);border-radius:.5rem;padding:.75rem .9rem}
.body .btn{margin-top:.6rem}
.fld{display:block;margin-top:.6rem}
.fld span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.15rem}
input[type=text],textarea,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);
  border:1.5px solid var(--line);border-radius:.5rem;padding:.45rem .6rem;width:100%;max-width:100%}
textarea{resize:vertical;min-height:2.6rem;display:block;overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:.5rem}
.row .fld{flex:1 1 7rem;margin-top:0}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.head-edit .fld{margin-top:.4rem}
h1 input{font-weight:800}
.hidden{display:none!important}
footer{border-top:2px solid var(--ink);padding-top:1.25rem;color:var(--muted);font-size:.9rem}
footer .foot-note{white-space:pre-wrap;max-width:44rem;margin:0}
@media (max-width:40rem){
  .day{grid-template-columns:1fr;gap:1rem}
  .day-head.view{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .7rem}
  .day-head.view .day-date{font-size:1.8rem}
  .day-head.view .day-aud,.day-head.view .day-count,.day-head.view .day-dow{margin-top:0}
  .day-head.view .day-el{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){.gaiter i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header id="head"></header>
  <section class="progress" aria-label="Прогресс">
    <div class="progress-top"><strong id="pcount"></strong><span id="pkinds"></span></div>
    <div class="gaiter" id="gaiter" role="progressbar" aria-valuemin="0"></div>
  </section>
  <div class="bar" id="filters" role="group" aria-label="Показать">
    <button type="button" class="btn" data-f="all" aria-pressed="true">Всё</button>
    <button type="button" class="btn" data-f="story" aria-pressed="false">Сторис</button>
    <button type="button" class="btn" data-f="post" aria-pressed="false">Посты</button>
    <button type="button" class="btn" data-f="reel" aria-pressed="false">Рилсы</button>
    <button type="button" class="btn" data-f="todo" aria-pressed="false">Не сделано</button>
  </div>
  <div class="bar" id="tools"></div>
  <section class="xfer hidden" id="xfer" aria-label="Перенос плана">
    <p>Чтобы перенести план на другое устройство, скопируйте этот текст и вставьте его там в такое же поле. Чтобы загрузить план сюда, вставьте текст вместо этого и нажмите «Применить».</p>
    <textarea id="xferText" rows="5" aria-label="Текст плана" style="overflow:auto"></textarea>
    <div class="actions">
      <button type="button" class="btn small" id="xferCopy">Скопировать</button>
      <button type="button" class="btn small" id="xferApply">Применить</button>
      <button type="button" class="btn small" id="xferClose">Закрыть</button>
    </div>
  </section>
  <p class="note" id="note" role="status"></p>
  <main id="days"></main>
  <footer id="foot"></footer>
</div>
<script>
const DEFAULT = {"title":"Собираем образ с нуля","lead":"Контент-план магазина «Танцуй» на 1–7 октября 2026. Каждый день — один элемент образа и одна аудитория. Отмечайте галочкой то, что уже вышло.","note":"Где публиковать. Сторис — Instagram и VK. В Telegram и MAX дублируйте дневную товарную сторис коротким постом в канал. Рилсы — Instagram Reels и VK Клипы, в Telegram и MAX — как видео. Посты — на все четыре площадки.\n\nЧто проверить перед публикацией. Из ассортимента подтверждены только яркие гетры и лосины. Обувь, купальники, инвентарь и условия заказа на коллектив записаны как предположение — замените на то, что реально есть в магазине.","days":[{"date":"01.10","dow":"Четверг","aud":"Взрослые танцоры","el":"Низ: лосины и гетры","items":[{"id":"d1s1","f":"story","t":"09:00","title":"Старт сюжета: с чего начинается образ","shoot":"Стойка с лосинами, рука перебирает вешалки. 5–7 секунд.","text":"Всю неделю собираем образ с нуля: от низа до аксессуаров. С чего начинаете вы?","sticker":"Опрос: «Лосины» / «Шорты»."},{"id":"d1s2","f":"story","t":"13:00","title":"Товар дня: лосины","shoot":"Три модели крупным планом: ткань, пояс, посадка на фигуре.","text":"Низ, в котором удобно и в шпагат, и в прыжок.","cta":"«Напишите слово “лосины” — пришлём размеры и цены»."},{"id":"d1s3","f":"story","t":"18:00","title":"Дискотека 90-х: образ за 5 минут","mark":"90-е","shoot":"Сотрудник или манекен в ярких лосинах и гетрах, энергичная музыка в духе 90-х, неоновый текст.","text":"Завтра дискотека 90-х? Яркие лосины + гетры — и образ готов.","cta":"«Забрать можно сегодня и завтра. Напишите нам — отложим ваш размер».","extra":"Единственная сторис про 90-е за неделю. Если не успели вечером — поставьте завтра первым делом с утра."}]},{"date":"02.10","dow":"Пятница","aud":"Родители","el":"Обувь для занятий","items":[{"id":"d2s1","f":"story","t":"09:00","title":"Викторина про детскую обувь","shoot":"Чешки, балетки и джазовки в ряд на светлом фоне.","text":"Что нужно на хореографию в 5 лет?","sticker":"Викторина с тремя вариантами. Правильный ответ: «То, что принято в вашей студии» — и объясните в следующей сторис."},{"id":"d2s2","f":"story","t":"13:00","title":"Товар дня: обувь и для чего каждая","shoot":"Каждая пара отдельно в руках, подпись с назначением.","text":"Чешки — для первых занятий. Балетки — для классики. Джазовки — для эстрадного и современного танца.","cta":"«Покажем, как измерить стопу дома. Напишите “размер”»."},{"id":"d2s3","f":"story","t":"18:00","title":"Закулисье: как подбираем обувь ребёнку","shoot":"Продавец помогает с примеркой. Лицо ребёнка не показываем без согласия родителей — достаточно ног и рук.","text":"Примерка занимает пять минут, а обувь потом служит весь сезон.","sticker":"Стикер «Вопрос»: «Спросите про размер или модель»."},{"id":"d2r1","f":"reel","t":"17:00","title":"Рилс 1: образ с нуля за 15 секунд","text":"Образ на тренировку за 15 секунд. Всю неделю разбираем его по частям в сторис. Что покажем первым — обувь или форму?","extra":"Переходы делайте на сильную долю музыки. Модель — взрослый танцор или ребёнок с согласия родителей.","steps":"Кадр 1. Пустой пол в зале или на светлом фоне. Текст: «Собираем образ с нуля».\nКадр 2. По хлопку появляется обувь. Текст: «Обувь».\nКадр 3. Хлопок — лосины. Текст: «Низ».\nКадр 4. Хлопок — купальник или футболка. Текст: «Верх».\nКадр 5. Хлопок — гетры и сумка. Текст: «Детали».\nКадр 6. Танцор в полном образе делает одно эффектное движение. Текст: «Готово. Танцуй»."}]},{"date":"03.10","dow":"Суббота","aud":"Родители","el":"Верх: купальник, футболка","items":[{"id":"d3s1","f":"story","t":"10:00","title":"Опрос: требования студии к форме","shoot":"Купальники на вешалках, разложенные по цветам.","text":"В вашей студии есть требования к форме?","sticker":"Опрос: «Да, строгие» / «Свободная»."},{"id":"d3p1","f":"post","t":"12:00","title":"Пост 1: что купить к первому занятию","shoot":"Раскладка сверху: обувь, лосины, купальник, гетры, резинки для волос, сумка.","text":"Ребёнок идёт на танцы. Что купить к первому занятию\n\nКороткий список, чтобы не брать лишнего.\n\n1. Обувь. Уточните у педагога, что принято в студии: чешки, балетки или джазовки. Мерьте в тех носках, в которых ребёнок будет заниматься.\n2. Низ. Лосины или шорты, которые не сползают и не сковывают движения.\n3. Верх. Купальник или футболка по фигуре: педагогу важно видеть спину и плечи.\n4. Гетры или носки. Для разогрева и на случай прохладного зала.\n5. Резинки и шпильки, если в студии просят пучок.\n6. Сумка или мешок для формы.\n\nНе уверены в требованиях? Напишите нам название студии или направление — подскажем, что обычно берут. В «Танцуй» весь комплект можно собрать за один визит.\n\nСохраните пост, чтобы не потерять."},{"id":"d3s2","f":"story","t":"13:00","title":"Товар дня: купальники и футболки","shoot":"Палитра цветов, крупно швы и ткань, одна модель на фигуре.","text":"Цвет формы лучше уточнить у педагога. Скажите какой — подберём.","cta":"«Напишите цвет и рост — пришлём варианты»."},{"id":"d3s3","f":"story","t":"18:00","title":"Анонс чек-листа","shoot":"Скриншот поста или та же раскладка сверху.","text":"Собрали чек-лист к первому занятию. Сохраните и перешлите тому, кто только записал ребёнка на танцы.","sticker":"Ссылка на пост."}]},{"date":"04.10","dow":"Воскресенье","aud":"Спортсмены","el":"Одежда для гимнастики, фитнеса, йоги","items":[{"id":"d4s1","f":"story","t":"11:00","title":"Опрос: чем занимаетесь","shoot":"Спокойный кадр: коврик, форма, бутылка воды.","text":"Сегодня про форму для зала. Чем занимаетесь вы?","sticker":"Опрос: «Гимнастика» / «Фитнес» / «Йога» / «Танцы»."},{"id":"d4s2","f":"story","t":"14:00","title":"Товар дня: три комплекта","shoot":"Три раскладки подряд, по одной на направление.","text":"Для гимнастики — по фигуре и без лишних швов. Для фитнеса — то, что отводит влагу. Для йоги — мягкое и тянущееся.","cta":"«Напишите направление — соберём комплект»."},{"id":"d4s3","f":"story","t":"19:00","title":"Игра «Это или то»","shoot":"Два товара рядом на одном кадре, две-три пары подряд.","text":"Топ или футболка? Шорты или лосины?","sticker":"Опрос на каждой паре."}]},{"date":"05.10","dow":"Понедельник","aud":"Спортсмены","el":"Аксессуары и инвентарь","items":[{"id":"d5s1","f":"story","t":"09:00","title":"Вопрос: что в вашей сумке","shoot":"Приоткрытая спортивная сумка, из неё что-то выглядывает.","text":"Что всегда лежит в вашей спортивной сумке?","sticker":"Стикер «Вопрос». Ответы пригодятся вечером."},{"id":"d5s2","f":"story","t":"13:00","title":"Товар дня: мелочи, которые забывают","shoot":"Коврик, резинки, наколенники, гетры — каждый предмет отдельным коротким кадром.","text":"Мелочи, без которых тренировка идёт хуже.","cta":"«Напишите “сумка” — пришлём подборку с ценами»."},{"id":"d5r2","f":"reel","t":"17:00","title":"Рилс 2: что лежит в сумке спортсмена","text":"Собрали сумку, с которой не страшно прийти на любую тренировку. Чего не хватает в вашей? Пишите в комментариях.","extra":"Снимайте одним планом со штатива, вещи доставайте в ритм.","steps":"Кадр 1. Вид сверху, закрытая сумка. Текст: «Что в сумке у того, кто не пропускает тренировки».\nКадры 2–6. Руки достают по одной вещи под бит: форма, обувь, гетры, резинка, коврик. На каждой вещи — короткая подпись.\nКадр 7. Всё красиво разложено вокруг сумки. Текст: «Чего не хватает в вашей?»."},{"id":"d5s3","f":"story","t":"18:00","title":"Ответы подписчиков и анонс рилса","shoot":"Два-три ответа из утреннего стикера, затем фрагмент рилса.","text":"Вот что носите с собой вы. А вот что положили бы мы.","sticker":"Ссылка на рилс."}]},{"date":"06.10","dow":"Вторник","aud":"Тренеры и студии","el":"Форма на коллектив","items":[{"id":"d6s1","f":"story","t":"09:00","title":"Опрос: вы тренер?","shoot":"Стопка одинаковой формы разных размеров.","text":"Сегодня день для тех, кто одевает целую группу.","sticker":"Опрос: «Я тренер» / «Перешлю своему тренеру»."},{"id":"d6s2","f":"story","t":"13:00","title":"Предложение: форма на группу одним заказом","shoot":"Ряд одинаковых купальников или футболок от маленького размера к большому.","text":"Соберём форму на всю группу: единый цвет, полный размерный ряд, один заказ.","cta":"«Напишите, сколько человек и какое направление — подготовим подборку».","extra":"Впишите свои условия: скидку от количества, сроки, возможность дозаказа."},{"id":"d6s3","f":"story","t":"18:00","title":"Отзыв студии или сборка большого заказа","shoot":"Фото коллектива в вашей форме с разрешения студии. Если такого нет — как упаковываете заказ на группу.","text":"Так выглядит группа, когда форма у всех одна.","sticker":"Отметка студии, если показываете её фото."}]},{"date":"07.10","dow":"Среда","aud":"Все","el":"Финал: готовые образы","items":[{"id":"d7s1","f":"story","t":"09:00","title":"Итог недели: образ собран","shoot":"Коллаж из кадров недели: низ, обувь, верх, аксессуары.","text":"Неделю собирали образ по частям. Сегодня показываем целиком."},{"id":"d7p2","f":"post","t":"12:00","title":"Пост 2: итоги недели и предложение студиям","shoot":"Карусель из трёх фото: образ для ребёнка, для взрослого танцора, для зала.","text":"Неделю собирали образ с нуля. Вот что получилось\n\nЧетверг — низ: лосины и гетры. Пятница — обувь. Суббота — верх. Воскресенье — одежда для гимнастики, фитнеса и йоги. Понедельник — аксессуары и инвентарь. Вторник — форма на коллектив.\n\nВ карусели три готовых образа: для ребёнка на хореографию, для взрослого танцора и для зала.\n\nТренерам и руководителям студий: соберём форму на всю группу одним заказом — единый цвет и полный размерный ряд. Напишите нам в сообщения, сколько человек и какое направление, подготовим подборку.\n\nА какой элемент образа вы выбираете дольше всего? Расскажите в комментариях."},{"id":"d7s2","f":"story","t":"13:00","title":"Три готовых образа","shoot":"Три образа подряд, каждый отдельной сторис-карточкой или одним видео.","text":"Для ребёнка на хореографию. Для взрослого танцора. Для зала.","sticker":"Опрос: «Какой ваш?»."},{"id":"d7s3","f":"story","t":"18:00","title":"Анонс поста и вопрос на следующую неделю","shoot":"Обложка поста, затем простой фон с вопросом.","text":"Итоги недели уже в ленте. Что разобрать дальше?","sticker":"Стикер «Вопрос»: «Какую тему хотите на следующей неделе?»."}]}]};
const FORMAT = {story:"Сторис", post:"Пост", reel:"Рилс"};
const NEW_TITLE = {story:"Новая сторис", post:"Новый пост", reel:"Новый рилс"};
const TEXT_LABEL = {story:"Текст на экране", post:"Текст поста", reel:"Подпись к рилсу"};
const LS_KEY = "tancuy-plan-v2", LS_OLD = "tancuy-plan-2026-10-01";
const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);
const note = $("note");

let plan = clone(DEFAULT), done = {}, filter = "all", editing = false;
const openIds = new Set();

function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function btn(label, cls, fn){ const b = el("button", "btn " + (cls||""), label); b.type = "button"; if(fn) b.addEventListener("click", fn); return b; }
function confirmBtn(label, ask, cls, fn){
  let armed = false, t = null;
  const b = btn(label, cls, () => {
    if(armed){ clearTimeout(t); fn(); return; }
    armed = true; b.textContent = ask;
    t = setTimeout(() => { armed = false; b.textContent = label; }, 4000);
  });
  return b;
}
function autosize(ta){ ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 2) + "px"; }
function field(obj, key, label, multi, placeholder){
  const wrap = el("label", "fld"); wrap.append(el("span", null, label));
  const inp = document.createElement(multi ? "textarea" : "input");
  if(!multi) inp.type = "text"; else inp.rows = 1;
  inp.value = obj[key] || ""; if(placeholder) inp.placeholder = placeholder;
  inp.addEventListener("input", () => { obj[key] = inp.value; if(multi) autosize(inp); touch(); });
  wrap.append(inp); return wrap;
}
function newId(){ return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function allItems(){ return plan.days.flatMap(d => d.items); }

/* ---------- отрисовка ---------- */
function render(){
  const head = $("head"); head.replaceChildren();
  if(editing){
    const h = el("h1"); h.append(field(plan, "title", "Заголовок")); head.append(h);
    const l = field(plan, "lead", "Описание под заголовком", true); l.style.marginBottom = "1.75rem"; head.append(l);
  }else{
    head.append(el("h1", null, plan.title || "Контент-план"));
    if(plan.lead) head.append(el("p", "lead", plan.lead));
  }

  const tools = $("tools"); tools.replaceChildren();
  $("filters").classList.toggle("hidden", editing);
  if(editing){
    tools.append(
      btn("Готово", "solid", () => setEditing(false)),
      btn("Перенос плана", "", openXfer),
      confirmBtn("Очистить всё", "Точно стереть весь план и отметки?", "danger", wipe));
  }else{
    tools.append(btn("Редактировать", "", () => setEditing(true)));
  }

  const main = $("days"); main.replaceChildren();
  plan.days.forEach((d, di) => main.append(renderDay(d, di)));
  if(editing) main.append(btn("Добавить день", "", () => {
    plan.days.push({date:"", dow:"", aud:"", el:"", items:[]}); commit();
  }));
  if(!plan.days.length && !editing) main.append(el("p", "empty", "План пуст. Нажмите «Редактировать», чтобы добавить дни и публикации."));

  const foot = $("foot"); foot.replaceChildren();
  if(editing) foot.append(field(plan, "note", "Примечания внизу страницы", true));
  else if(plan.note) foot.append(el("p", "foot-note", plan.note));
  foot.classList.toggle("hidden", !editing && !plan.note);

  document.querySelectorAll("textarea").forEach(ta => { if(ta.id !== "xferText") autosize(ta); });
  paint();
}

function renderDay(d, di){
  const sec = el("section", "day");
  const head = el("div", "day-head " + (editing ? "head-edit" : "view"));
  if(editing){
    head.append(field(d, "date", "Дата", false, "08.10"), field(d, "dow", "День недели"),
      field(d, "aud", "Аудитория"), field(d, "el", "Тема дня"));
    const a = el("div", "actions");
    a.append(confirmBtn("Удалить день", "Точно удалить день?", "small danger", () => {
      d.items.forEach(i => delete done[i.id]); plan.days.splice(di, 1); commit();
    }));
    head.append(a);
  }else{
    head.append(el("div", "day-date", d.date || "—"), el("div", "day-dow", d.dow), el("div", "day-aud", d.aud), el("div", "day-el", d.el));
    const c = el("div", "day-count"); c.dataset.count = di; head.append(c);
  }
  const list = el("div", "day-items");
  d.items.forEach((it, ii) => list.append(editing ? renderEdit(d, it, ii) : renderView(it)));
  if(editing){
    const a = el("div", "actions");
    ["story","post","reel"].forEach(f => a.append(btn("Добавить " + FORMAT[f].toLowerCase(), "small", () => {
      d.items.push({id:newId(), f, t:"", title:NEW_TITLE[f]}); commit();
    })));
    list.append(a);
  }else if(!d.items.length){
    list.append(el("p", "empty", "На этот день пока ничего нет."));
  }
  sec.append(head, list); return sec;
}

function renderView(it){
  const item = el("div", "item"); item.dataset.id = it.id; item.dataset.f = it.f;
  const lab = el("label", "check");
  const cb = document.createElement("input"); cb.type = "checkbox";
  cb.setAttribute("aria-label", "Готово: " + (it.title || FORMAT[it.f]));
  cb.addEventListener("change", () => { if(cb.checked) done[it.id] = true; else delete done[it.id]; paint(); save(); });
  lab.append(cb);
  const det = document.createElement("details"); det.open = openIds.has(it.id);
  det.addEventListener("toggle", () => { if(det.open) openIds.add(it.id); else openIds.delete(it.id); });
  const sum = document.createElement("summary");
  if(it.t) sum.append(el("span", "time", it.t));
  sum.append(el("span", "tag " + it.f, FORMAT[it.f]));
  if(it.mark) sum.append(el("span", "tag mark", it.mark));
  sum.append(el("span", "title", it.title || "Без названия"));
  const body = el("div", "body"), dl = el("dl");
  const row = (label, value, cls) => { if(!value) return null; const dd = el("dd", cls, value); dl.append(el("dt", null, label), dd); return dd; };
  row("Что снять", it.shoot);
  row("Сценарий", it.steps);
  const copyable = it.f !== "story";
  const tdd = row(TEXT_LABEL[it.f], it.text, copyable ? "text" : null);
  if(tdd && copyable){
    const b = btn("Скопировать текст", "small", async () => {
      try{ await navigator.clipboard.writeText(it.text); b.textContent = "Текст скопирован"; }
      catch(e){ const r = document.createRange(); r.selectNodeContents(tdd); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Текст выделен — скопируйте вручную"; }
      setTimeout(() => b.textContent = "Скопировать текст", 2500);
    });
    dl.append(b);
  }
  row("Интерактив", it.sticker); row("Призыв", it.cta); row("На заметку", it.extra);
  if(!dl.children.length) dl.append(el("dd", null, "Описание пока не заполнено."));
  body.append(dl); det.append(sum, body); item.append(lab, det); return item;
}

function renderEdit(d, it, ii){
  const item = el("div", "item editing");
  const r = el("div", "row");
  const fw = el("label", "fld"); fw.append(el("span", null, "Формат"));
  const sel = document.createElement("select");
  Object.keys(FORMAT).forEach(f => { const o = el("option", null, FORMAT[f]); o.value = f; sel.append(o); });
  sel.value = it.f; sel.addEventListener("change", () => { it.f = sel.value; commit(); });
  fw.append(sel);
  r.append(field(it, "t", "Время", false, "09:00"), fw, field(it, "mark", "Метка", false, "например, 90-е"));
  item.append(r, field(it, "title", "Название"), field(it, "shoot", "Что снять", true));
  if(it.f === "reel") item.append(field(it, "steps", "Сценарий по кадрам", true));
  item.append(field(it, "text", TEXT_LABEL[it.f], true), field(it, "sticker", "Интерактив", true),
    field(it, "cta", "Призыв", true), field(it, "extra", "На заметку", true));
  const a = el("div", "actions");
  a.append(confirmBtn("Удалить", "Точно удалить?", "small danger", () => { delete done[it.id]; d.items.splice(ii, 1); commit(); }));
  item.append(a); return item;
}

function paint(){
  const items = allItems(), total = items.length;
  const n = items.filter(i => done[i.id]).length;
  document.querySelectorAll(".item[data-id]").forEach(item => {
    const on = !!done[item.dataset.id];
    item.classList.toggle("done", on);
    item.querySelector("input").checked = on;
    const show = filter === "all" || (filter === "todo" ? !on : item.dataset.f === filter);
    item.classList.toggle("hidden", !show);
  });
  if(!editing) document.querySelectorAll(".day").forEach((sec, i) => {
    const its = plan.days[i].items;
    const c = sec.querySelector(".day-count");
    if(c) c.textContent = its.length ? "Готово " + its.filter(x => done[x.id]).length + " из " + its.length : "";
    sec.classList.toggle("hidden", filter !== "all" && !sec.querySelector(".item:not(.hidden)"));
  });
  $("pcount").textContent = !total ? "Пока пусто" : n === total ? "Всё готово: " + n + " из " + total : "Готово " + n + " из " + total;
  const k = f => items.filter(i => i.f === f).length;
  $("pkinds").textContent = "Сторис: " + k("story") + ", посты: " + k("post") + ", рилсы: " + k("reel");
  const g = $("gaiter");
  while(g.children.length > total) g.lastChild.remove();
  while(g.children.length < total) g.append(el("i"));
  g.setAttribute("aria-valuemax", total); g.setAttribute("aria-valuenow", n);
  [...g.children].forEach((s, i) => s.classList.toggle("on", i < n));
}

function setEditing(on){
  editing = on;
  if(!on){
    plan.days.forEach(d => d.items.sort((a, b) => (a.t || "99").localeCompare(b.t || "99")));
    $("xfer").classList.add("hidden"); save();
  }
  render();
}
function commit(){ save(); render(); }
function wipe(){
  plan = {title:"Контент-план", lead:"", note:"", days:[]};
  done = {}; openIds.clear(); commit();
  note.textContent = "План очищен. Добавьте день, чтобы начать заново.";
}

$("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  paint();
});

/* ---------- перенос плана ---------- */
function validPlan(p){ return p && Array.isArray(p.days) && p.days.every(d => d && Array.isArray(d.items)); }
function openXfer(){ $("xferText").value = JSON.stringify({plan, done}); $("xfer").classList.remove("hidden"); $("xferText").focus(); $("xferText").select(); }
$("xferClose").addEventListener("click", () => $("xfer").classList.add("hidden"));
$("xferCopy").addEventListener("click", async () => {
  const ta = $("xferText");
  try{ await navigator.clipboard.writeText(ta.value); note.textContent = "Текст плана скопирован."; }
  catch(e){ ta.focus(); ta.select(); note.textContent = "Текст выделен — скопируйте его вручную."; }
});
$("xferApply").addEventListener("click", () => {
  let d = null;
  try{ d = JSON.parse($("xferText").value); }catch(e){}
  if(!d || !validPlan(d.plan)){ note.textContent = "Не получилось прочитать текст плана. Проверьте, что он скопирован целиком."; return; }
  d.plan.days.forEach(day => day.items.forEach(i => { if(!i.id) i.id = newId(); if(!FORMAT[i.f]) i.f = "story"; }));
  plan = d.plan; done = d.done && typeof d.done === "object" ? d.done : {};
  $("xfer").classList.add("hidden"); commit();
  note.textContent = "План загружен.";
});

/* ---------- сохранение: общая база страницы, иначе память браузера ---------- */
let ref = null, writing = false, dirty = false, timer = null;
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({plan, done})); return true; }catch(e){ return false; } }
function save(){
  clearTimeout(timer); timer = null;
  const ok = saveLocal();
  if(ref){ dirty = true; flush(); }
  else if(!ok) note.textContent = "Браузер не даёт сохранять изменения: они пропадут, когда закроете страницу.";
}
function touch(){ clearTimeout(timer); timer = setTimeout(save, 400); }
async function flush(){
  if(!ref || writing) return;
  writing = true;
  try{ while(dirty){ dirty = false; await ref.set(clone({plan, done})); } }
  catch(e){ note.textContent = "Изменения не сохранились на сервере и останутся только в этом браузере."; ref = null; }
  writing = false;
}
try{
  const raw = localStorage.getItem(LS_KEY);
  if(raw){ const d = JSON.parse(raw); if(d && validPlan(d.plan)){ plan = d.plan; done = d.done || {}; } }
  else{ const old = localStorage.getItem(LS_OLD); if(old) done = JSON.parse(old) || {}; }
}catch(e){}
render();

(async () => {
  if(!window.claude || typeof window.claude.use !== "function") return;
  let db = null;
  try{ db = await window.claude.use("db"); }catch(e){}
  if(!db) return;
  ref = db.doc("plan/state");
  let first = true;
  ref.onSnapshot(async snap => {
    const wasFirst = first; first = false;
    if(writing || dirty || timer) return;
    if(snap.exists){
      const d = snap.data() || {};
      if(!validPlan(d.plan)) return;
      const next = {plan:d.plan, done:d.done || {}};
      if(JSON.stringify(next) === JSON.stringify({plan, done})) return;
      const a = document.activeElement;
      if(editing && a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
      plan = next.plan; done = next.done; saveLocal(); render();
    }else if(wasFirst){
      try{ const old = await db.doc("plan/checks").get(); if(old.exists){ done = Object.assign({}, (old.data() || {}).done || {}); paint(); } }catch(e){}
    }
  }, () => { ref = null; });
})();
</script>
</body>
</html>
